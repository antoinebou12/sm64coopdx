name: Switch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - Makefile
      - Makefile.sdl3
      - Makefile.switch
      - Makefile.switch-game
      - Makefile.switch-platform
      - Makefile.switch-portlibs
      - 'src/**'
      - 'lib/lua/include/**'
      - 'tools/switch/**'
      - 'sm64.us.sha1'
      - '.github/workflows/build-switch-game.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVKITPRO: /opt/devkitpro

jobs:
  portability:
    name: Horizon portability gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add devkitA64 to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitA64/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Run Switch unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/switch/tests/run_tests.py

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/switch-ci
          {
            echo "git_sha=${GITHUB_SHA}"
            aarch64-none-elf-gcc --version | head -n 1
            dkp-pacman -Q libnx
            dkp-pacman -Q devkitA64
            dkp-pacman -Q switch-sdl2
            dkp-pacman -Q switch-mesa
            dkp-pacman -Q switch-curl
            dkp-pacman -Q switch-zlib
          } | tee build/switch-ci/TOOLCHAIN.txt

      - name: Build SDL2/GLES2/curl/zlib probe NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-portlibs clean
          make -f Makefile.switch-portlibs -j2 probe

      - name: Build lifecycle/native-input probe NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-platform clean
          make -f Makefile.switch-platform -j2 probe

      - name: Validate full-game toolchain and source overlays
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-game switch-toolchain-check
          mkdir -p build/switch-ci/overlays
          python3 tools/switch/source_overlay.py pc_main src/pc/pc_main.c build/switch-ci/overlays/pc_main.c
          python3 tools/switch/source_overlay.py platform src/pc/platform.c build/switch-ci/overlays/platform.c
          python3 tools/switch/source_overlay.py controller_bind src/pc/controller/controller_bind_mapping.c build/switch-ci/overlays/controller_bind_mapping.c
          python3 tools/switch/source_overlay.py djui_controls src/pc/djui/djui_panel_controls.c build/switch-ci/overlays/djui_panel_controls.c
          python3 tools/switch/source_overlay.py loading src/pc/loading.c build/switch-ci/overlays/loading.c
          python3 tools/switch/source_overlay.py network src/pc/network/network.c build/switch-ci/overlays/network.c
          python3 tools/switch/source_overlay.py djui_host src/pc/djui/djui_panel_host.c build/switch-ci/overlays/djui_panel_host.c
          python3 tools/switch/ci_source_check.py

      - name: Compile every Switch overlay and local-wireless object
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-game -j2 \
            build/us_switch/src/pc/pc_main.o \
            build/us_switch/src/pc/platform.o \
            build/us_switch/src/pc/loading.o \
            build/us_switch/src/pc/controller/controller_bind_mapping.o \
            build/us_switch/src/pc/djui/djui_panel_controls.o \
            build/us_switch/src/pc/network/network.o \
            build/us_switch/src/pc/network/socket/socket_ldn.o \
            build/us_switch/src/pc/network/socket/socket_ldn_util.o \
            build/us_switch/src/pc/network/socket/socket_ldn_glue.o \
            build/us_switch/src/pc/djui/djui_panel_host.o \
            build/us_switch/src/pc/djui/djui_panel_ldn_browser.o \
            build/us_switch/src/pc/djui/djui_panel_join.o \
            build/us_switch/src/pc/platform/switch/switch_packet_safety.o
          for obj in \
            build/us_switch/src/pc/pc_main.o \
            build/us_switch/src/pc/platform.o \
            build/us_switch/src/pc/loading.o \
            build/us_switch/src/pc/controller/controller_bind_mapping.o \
            build/us_switch/src/pc/djui/djui_panel_controls.o \
            build/us_switch/src/pc/network/network.o \
            build/us_switch/src/pc/network/socket/socket_ldn.o \
            build/us_switch/src/pc/network/socket/socket_ldn_util.o \
            build/us_switch/src/pc/network/socket/socket_ldn_glue.o \
            build/us_switch/src/pc/djui/djui_panel_host.o \
            build/us_switch/src/pc/djui/djui_panel_ldn_browser.o \
            build/us_switch/src/pc/djui/djui_panel_join.o \
            build/us_switch/src/pc/platform/switch/switch_packet_safety.o; do
            test -s "$obj"
            aarch64-none-elf-readelf -h "$obj" >/dev/null
          done
          aarch64-none-elf-nm build/us_switch/src/pc/platform/switch/switch_packet_safety.o | \
            grep -E '__wrap_(network_receive|network_send|network_send_to|packet_compress|packet_decompress)'

      - name: Validate probe outputs
        shell: bash
        run: |
          set -euo pipefail
          for prefix in \
            build/switch-portlibs/sm64coopdx-switch-portlibs \
            build/switch-platform/sm64coopdx-switch-platform; do
            test -s "${prefix}.nro"
            test -s "${prefix}.elf"
            test "$(dd if="${prefix}.nro" bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"
            aarch64-none-elf-readelf -h "${prefix}.elf" >/dev/null
          done

      - name: Upload portability diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: switch-portability-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/switch-ci/TOOLCHAIN.txt
            build/switch-ci/overlays/*.c
            build/switch-portlibs/*.nro
            build/switch-portlibs/*.elf
            build/switch-portlibs/*.map
            build/switch-platform/*.nro
            build/switch-platform/*.elf
            build/switch-platform/*.map

  full-nro:
    name: Full Horizon game NRO
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: portability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: devkitpro/devkita64:latest
    env:
      SM64_BASEROM_US_URL: ${{ secrets.SM64_BASEROM_US_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add devkitA64 to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitA64/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Install asset pipeline dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The devkitpro image ships no hexdump, which the sound and
          # texture pipelines shell out to when packing the baserom assets.
          apt-get update -qq
          apt-get install -y -qq bsdextrautils

      - name: Detect private baserom source
        id: baserom
        shell: bash
        run: |
          if [[ -n "${SM64_BASEROM_US_URL}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Full Switch NRO skipped"
              echo "Set repository secret \`SM64_BASEROM_US_URL\` to a private HTTPS URL for your legally obtained US baserom to enable the complete build."
              echo "The asset-free Horizon portability job still ran and must pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch and verify private US baserom
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "${SM64_BASEROM_US_URL}" -o baserom.us.z64
          expected="$(awk 'NR==1 {print $1}' sm64.us.sha1)"
          actual="$(sha1sum baserom.us.z64 | awk '{print $1}')"
          test -n "$expected"
          if [[ "$actual" != "$expected" ]]; then
            echo "baserom.us.z64 SHA-1 mismatch" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

      - name: Build full Switch NRO
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-game switch-nro -j2

      - name: Validate full-game outputs
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/switch-ci
          prefix=build/us_switch/sm64coopdx
          test -s "${prefix}.nro"
          test -s "${prefix}.elf"
          test -s "${prefix}.map"
          test -s "${prefix}.nacp"
          test "$(dd if="${prefix}.nro" bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"
          aarch64-none-elf-readelf -h "${prefix}.elf" | tee build/switch-ci/ELF_HEADER.txt
          aarch64-none-elf-size "${prefix}.elf" | tee build/switch-ci/SIZE.txt
          sha256sum "${prefix}.nro" "${prefix}.elf" "${prefix}.map" "${prefix}.nacp" | tee build/switch-ci/SHA256SUMS.txt
          cp build/switch-deps/lua/lib/SHA256SUMS.txt build/switch-ci/LUA_SHA256SUMS.txt
          {
            echo "### Full Switch NRO build passed"
            echo "The baserom-backed NRO was built and validated on this runner."
            echo "Only metadata and hashes are retained as CI artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private baserom
        if: always() && steps.baserom.outputs.available == 'true'
        shell: bash
        run: rm -f baserom.us.z64

      - name: Upload full-build diagnostics
        if: steps.baserom.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sm64coopdx-switch-build-diagnostics-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/switch-ci/ELF_HEADER.txt
            build/switch-ci/SIZE.txt
            build/switch-ci/SHA256SUMS.txt
            build/switch-ci/LUA_SHA256SUMS.txt
