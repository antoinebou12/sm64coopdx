name: Switch platform probe

on:
  push:
    branches:
      - 'agent/switch-platform**'
    paths:
      - Makefile.switch-platform
      - src/pc/platform/switch/**
      - tools/switch/platform_probe.c
      - .github/workflows/build-switch-platform.yml
  pull_request:
    branches:
      - agent/switch-portlibs-probe
    paths:
      - Makefile.switch-platform
      - src/pc/platform/switch/**
      - tools/switch/platform_probe.c
      - .github/workflows/build-switch-platform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVKITPRO: /opt/devkitpro

jobs:
  lifecycle-probe:
    name: libnx lifecycle boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report libnx toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/switch-platform
          {
            echo "git_sha=${GITHUB_SHA}"
            aarch64-none-elf-gcc --version | head -n 1
            dkp-pacman -Q libnx
            dkp-pacman -Q devkitA64
          } | tee build/switch-platform/TOOLCHAIN.txt

      - name: Build platform probe
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-platform clean
          make -f Makefile.switch-platform probe

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          prefix=build/switch-platform/sm64coopdx-switch-platform
          test -s "${prefix}.nro"
          test -s "${prefix}.elf"
          test -s "${prefix}.map"
          test -s "${prefix}.nacp"
          test "$(dd if="${prefix}.nro" bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"
          aarch64-none-elf-readelf -h "${prefix}.elf" | tee build/switch-platform/ELF_HEADER.txt
          sha256sum "${prefix}.nro" "${prefix}.elf" "${prefix}.map" "${prefix}.nacp" \
            | tee build/switch-platform/SHA256SUMS.txt

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-platform-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/switch-platform/sm64coopdx-switch-platform.nro
            build/switch-platform/sm64coopdx-switch-platform.elf
            build/switch-platform/sm64coopdx-switch-platform.map
            build/switch-platform/sm64coopdx-switch-platform.nacp
            build/switch-platform/TOOLCHAIN.txt
            build/switch-platform/ELF_HEADER.txt
            build/switch-platform/SHA256SUMS.txt
