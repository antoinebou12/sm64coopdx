name: Switch crash logger CI

on:
  push:
    branches:
      - switch-crash-logging
  pull_request:
    branches:
      - main
    paths:
      - 'src/pc/platform/switch/switch_crash_log.*'
      - 'Makefile.switch-sdmc'
      - '.github/workflows/switch-crash-logging.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVKITPRO: /opt/devkitpro

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add devkitA64 to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitA64/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Validate Switch toolchain
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-game switch-toolchain-check

      - name: Cross-compile crash logger
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-game -j2 build/us_switch/src/pc/platform/switch/switch_crash_log.o
          test -s build/us_switch/src/pc/platform/switch/switch_crash_log.o
          aarch64-none-elf-readelf -h build/us_switch/src/pc/platform/switch/switch_crash_log.o
          aarch64-none-elf-nm build/us_switch/src/pc/platform/switch/switch_crash_log.o | grep -E '__libnx_exception_handler|userAppInit|userAppExit|__wrap_main_rom_handler|__wrap_rom_assets_load'

      - name: Validate SD layout target
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch-sdmc -n switch-sdmc-layout > build/sdmc-layout-dry-run.txt
          grep -q 'sm64coopdx.nro' build/sdmc-layout-dry-run.txt
          grep -q 'baserom.us.z64' build/sdmc-layout-dry-run.txt
          grep -q -- '--wrap=main_rom_handler' build/sdmc-layout-dry-run.txt
          grep -q -- '--wrap=rom_assets_load' build/sdmc-layout-dry-run.txt
