name: Build New 3DS Port

on:
  push:
    branches:
      - main
      - new3ds-port
    paths:
      - Makefile.new3ds
      - Makefile.new3ds-game
      - tools/new3ds/**
      - src/pc/platform/new3ds/**
      - src/pc/audio/audio_new3ds.*
      - src/pc/controller/controller_new3ds.*
      - src/pc/controller/controller_entry_point.c
      - src/pc/gfx/gfx_citro3d_new3ds.*
      - src/pc/gfx/gfx_window_manager.h
      - src/pc/pc_main.h
      - src/pc/thread.h
      - docs/new3ds-port.md
      - .github/workflows/build-new3ds.yml
  pull_request:
    paths:
      - Makefile.new3ds
      - Makefile.new3ds-game
      - tools/new3ds/**
      - src/pc/platform/new3ds/**
      - src/pc/audio/audio_new3ds.*
      - src/pc/controller/controller_new3ds.*
      - src/pc/controller/controller_entry_point.c
      - src/pc/gfx/gfx_citro3d_new3ds.*
      - src/pc/gfx/gfx_window_manager.h
      - src/pc/pc_main.h
      - src/pc/thread.h
      - docs/new3ds-port.md
      - .github/workflows/build-new3ds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-new3ds-shell:
    name: devkitARM / shell + platform smoke
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Print toolchain configuration
        run: make -f Makefile.new3ds print-config

      - name: Cross-compile New 3DS platform layers
        run: make -f Makefile.new3ds port-smoke -j2

      - name: Build New 3DS shell
        run: make -f Makefile.new3ds -j2

      - name: Verify shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/new3ds-shell/sm64coopdx-new3ds.elf
          test -s build/new3ds-shell/sm64coopdx-new3ds.3dsx
          test -s build/new3ds-shell/sm64coopdx-new3ds.smdh
          test -s build/new3ds-shell/gfx_citro3d_new3ds.smoke.o
          test -s build/new3ds-shell/controller_new3ds.smoke.o
          test -s build/new3ds-shell/new3ds_window_manager.smoke.o
          test -s build/new3ds-shell/audio_new3ds.smoke.o
          test -s build/new3ds-shell/new3ds_thread.smoke.o
          test -s build/new3ds-shell/new3ds_shader.shbin
          arm-none-eabi-size build/new3ds-shell/sm64coopdx-new3ds.elf
          ls -lh build/new3ds-shell/sm64coopdx-new3ds.{elf,3dsx,smdh}
          ls -lh build/new3ds-shell/*.smoke.o build/new3ds-shell/new3ds_shader.shbin

      - name: Upload New 3DS shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-new3ds-foundation
          if-no-files-found: error
          path: |
            build/new3ds-shell/sm64coopdx-new3ds.elf
            build/new3ds-shell/sm64coopdx-new3ds.3dsx
            build/new3ds-shell/sm64coopdx-new3ds.smdh
            build/new3ds-shell/gfx_citro3d_new3ds.smoke.o
            build/new3ds-shell/controller_new3ds.smoke.o
            build/new3ds-shell/new3ds_window_manager.smoke.o
            build/new3ds-shell/audio_new3ds.smoke.o
            build/new3ds-shell/new3ds_thread.smoke.o
            build/new3ds-shell/new3ds_shader.shbin

  build-new3ds-game:
    name: devkitARM / full CoopDX integration
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required 3DS portlibs
        run: dkp-pacman -Syu --noconfirm 3ds-dev 3ds-zlib

      - name: Build full New 3DS application
        run: make -f Makefile.new3ds-game new3ds-3dsx -j2

      - name: Verify full-game artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/us_new3ds/sm64coopdx.elf
          test -s build/us_new3ds/sm64coopdx.3dsx
          test -s build/us_new3ds/sm64coopdx.smdh
          arm-none-eabi-size build/us_new3ds/sm64coopdx.elf
          ls -lh build/us_new3ds/sm64coopdx.{elf,3dsx,smdh}

      - name: Upload full-game artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-new3ds-game
          if-no-files-found: error
          path: |
            build/us_new3ds/sm64coopdx.elf
            build/us_new3ds/sm64coopdx.3dsx
            build/us_new3ds/sm64coopdx.smdh
            build/us_new3ds/sm64coopdx.map
