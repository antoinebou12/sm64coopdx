name: Build New 3DS Port

on:
  push:
    branches:
      - main
      - new3ds-port
    paths:
      - Makefile.new3ds
      - Makefile.new3ds-game
      - tools/new3ds/**
      - scripts/ci/new3ds-*.sh
      - docker/new3ds/**
      - docker-compose.new3ds.yml
      - src/pc/platform/new3ds/**
      - src/pc/audio/audio_new3ds.*
      - src/pc/controller/controller_new3ds.*
      - src/pc/controller/controller_entry_point.c
      - src/pc/gfx/gfx_citro3d_new3ds.*
      - src/pc/gfx/gfx_window_manager.h
      - src/pc/pc_main.*
      - src/pc/thread.h
      - src/pc/mods/mod_fs.cpp
      - src/pc/lua/smlua.h
      - src/engine/lighting_engine.cpp
      - data/dynos*
      - include/PR/ultratypes.h
      - docs/new3ds-port.md
      - .github/workflows/build-new3ds.yml
  pull_request:
    paths:
      - Makefile.new3ds
      - Makefile.new3ds-game
      - tools/new3ds/**
      - scripts/ci/new3ds-*.sh
      - docker/new3ds/**
      - docker-compose.new3ds.yml
      - src/pc/platform/new3ds/**
      - src/pc/audio/audio_new3ds.*
      - src/pc/controller/controller_new3ds.*
      - src/pc/controller/controller_entry_point.c
      - src/pc/gfx/gfx_citro3d_new3ds.*
      - src/pc/gfx/gfx_window_manager.h
      - src/pc/pc_main.*
      - src/pc/thread.h
      - src/pc/mods/mod_fs.cpp
      - src/pc/lua/smlua.h
      - src/engine/lighting_engine.cpp
      - data/dynos*
      - include/PR/ultratypes.h
      - docs/new3ds-port.md
      - .github/workflows/build-new3ds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new3ds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITARM: /opt/devkitpro/devkitARM

jobs:
  build-new3ds-shell:
    name: devkitARM / shell + platform smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev 3ds-zlib
          apt-get update -qq
          apt-get install -y -qq git python3 curl bsdextrautils

      - name: Add devkitARM to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitARM/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Cross-compile New 3DS shell and platform smoke
        shell: bash
        run: scripts/ci/new3ds-shell.sh

      - name: Upload New 3DS shell artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-new3ds-foundation
          if-no-files-found: error
          path: |
            build/new3ds-shell/sm64coopdx-new3ds.elf
            build/new3ds-shell/sm64coopdx-new3ds.3dsx
            build/new3ds-shell/sm64coopdx-new3ds.smdh
            build/new3ds-shell/*.smoke.o
            build/new3ds-shell/new3ds_shader.shbin

  build-new3ds-integration:
    name: devkitARM / shared integration compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-new3ds-shell
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev 3ds-zlib
          apt-get update -qq
          apt-get install -y -qq git python3 curl bsdextrautils

      - name: Add devkitARM to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitARM/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Compile shared engine + DynOS integration objects
        shell: bash
        run: scripts/ci/new3ds-integration.sh

  build-new3ds-game:
    name: devkitARM / full CoopDX .3dsx
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-new3ds-integration
    container:
      image: devkitpro/devkitarm:latest
    env:
      SM64_BASEROM_US_URL: ${{ secrets.SM64_BASEROM_US_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required 3DS portlibs
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev 3ds-zlib
          apt-get update -qq
          apt-get install -y -qq git python3 curl bsdextrautils

      - name: Add devkitARM to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "${DEVKITPRO}/devkitARM/bin" >> "$GITHUB_PATH"
          echo "${DEVKITPRO}/tools/bin" >> "$GITHUB_PATH"

      - name: Detect private baserom source
        id: baserom
        shell: bash
        run: |
          if [[ -n "${SM64_BASEROM_US_URL}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Full New 3DS .3dsx skipped"
              echo "Set repository secret \`SM64_BASEROM_US_URL\` to enable the baserom-backed full build."
              echo "Shell and integration compile jobs still ran and must pass."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch and verify private US baserom
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "${SM64_BASEROM_US_URL}" -o baserom.us.z64
          expected="$(awk 'NR==1 {print $1}' sm64.us.sha1)"
          actual="$(sha1sum baserom.us.z64 | awk '{print $1}')"
          test -n "$expected"
          if [[ "$actual" != "$expected" ]]; then
            echo "baserom.us.z64 SHA-1 mismatch" >&2
            exit 1
          fi

      - name: Build full New 3DS application
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: make -f Makefile.new3ds-game new3ds-3dsx -j2

      - name: Verify full-game artifacts
        if: steps.baserom.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s build/us_new3ds/sm64coopdx.elf
          test -s build/us_new3ds/sm64coopdx.3dsx
          test -s build/us_new3ds/sm64coopdx.smdh
          arm-none-eabi-size build/us_new3ds/sm64coopdx.elf

      - name: Remove private baserom
        if: always() && steps.baserom.outputs.available == 'true'
        shell: bash
        run: rm -f baserom.us.z64

      - name: Upload full-game artifacts
        if: ${{ steps.baserom.outputs.available == 'true' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-new3ds-game
          if-no-files-found: error
          path: |
            build/us_new3ds/sm64coopdx.elf
            build/us_new3ds/sm64coopdx.3dsx
            build/us_new3ds/sm64coopdx.smdh
            build/us_new3ds/sm64coopdx.map
