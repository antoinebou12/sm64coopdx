name: Switch bootstrap

on:
  push:
    branches:
      - main
      - 'agent/main-upstream-prs-switch'
    paths:
      - Makefile.switch
      - tools/switch/**
      - docs/switch/**
      - .github/workflows/build-switch.yml
  pull_request:
    branches:
      - main
    paths:
      - Makefile.switch
      - tools/switch/**
      - docs/switch/**
      - .github/workflows/build-switch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVKITPRO: /opt/devkitpro

jobs:
  libnx-smoke:
    name: libnx smoke NRO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/switch-smoke
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "devkitpro=${DEVKITPRO}"
            aarch64-none-elf-gcc --version | head -n 1
            dkp-pacman -Q libnx
            dkp-pacman -Q devkitA64
          } | tee build/switch-smoke/TOOLCHAIN.txt

      - name: Validate Switch tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "${DEVKITPRO}/devkitA64/bin/aarch64-none-elf-gcc"
          test -f "${DEVKITPRO}/libnx/switch.specs"
          test -x "${DEVKITPRO}/tools/bin/elf2nro"
          test -x "${DEVKITPRO}/tools/bin/nacptool"

      - name: Build smoke NRO
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.switch clean
          make -f Makefile.switch -j2 smoke

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          prefix=build/switch-smoke/sm64coopdx-switch-smoke
          test -s "${prefix}.nro"
          test -s "${prefix}.elf"
          test -s "${prefix}.map"
          test -s "${prefix}.nacp"
          test "$(dd if="${prefix}.nro" bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"
          aarch64-none-elf-readelf -h "${prefix}.elf" | tee build/switch-smoke/ELF_HEADER.txt
          sha256sum "${prefix}.nro" "${prefix}.elf" "${prefix}.map" "${prefix}.nacp" | tee build/switch-smoke/SHA256SUMS.txt

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: switch-toolchain-smoke-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/switch-smoke/sm64coopdx-switch-smoke.nro
            build/switch-smoke/sm64coopdx-switch-smoke.elf
            build/switch-smoke/sm64coopdx-switch-smoke.map
            build/switch-smoke/sm64coopdx-switch-smoke.nacp
            build/switch-smoke/TOOLCHAIN.txt
            build/switch-smoke/ELF_HEADER.txt
            build/switch-smoke/SHA256SUMS.txt
